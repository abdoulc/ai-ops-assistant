services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres_pgvector
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: vector_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app_user -d vector_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ops-app-engine:
    build: .
    container_name: app_engine
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/vector_db
      - SPRING_DATASOURCE_USERNAME=app_user
      - SPRING_DATASOURCE_PASSWORD=app_password
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
      - SPRING_AI_OLLAMA_CHAT_MODEL=qwen3:0.6b
      - SPRING_AI_OLLAMA_CHAT_TEMPERATURE=0
      - SPRING_AI_OLLAMA_CHAT_NUM_PREDICT=200
      - SPRING_AI_OLLAMA_CHAT_THINK=false
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test:   [
        "CMD-SHELL",
        "curl --fail --silent http://localhost:8080/actuator/health/readiness || exit 1"
      ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  ollama_data:
  postgres_data: