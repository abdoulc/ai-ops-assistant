spring:
  ai:
    retry:
      max-attempts: ${AI_RETRY_MAX_ATTEMPTS:1}
  http:
    clients:
      connect-timeout: ${HTTP_CONNECT_TIMEOUT:3s}
      read-timeout: ${HTTP_READ_TIMEOUT:5m}
management:
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.web: INFO
    org.springframework.ai: INFO
  pattern:
    correlation: "[correlationId=%X{correlationId:-none}] "
